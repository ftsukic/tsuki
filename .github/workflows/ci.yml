name: CI

on:
  push:
    branches: [main, '0.x']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      APP_VARIANT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Example app line
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            target_branch="$GITHUB_BASE_REF"
          else
            target_branch="$GITHUB_REF_NAME"
          fi

          case "$target_branch" in
            main) app_line="1.x" ;;
            0.x) app_line="0.x" ;;
            *)
              echo "::error::Unsupported Example target branch: $target_branch"
              exit 1
              ;;
          esac

          echo "APP_LINE=$app_line" >> "$GITHUB_ENV"
          echo "Example target branch: $target_branch (APP_LINE=$app_line, APP_VARIANT=$APP_VARIANT)"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install example dependencies
        run: yarn --cwd example install --immutable

      - name: Commitlint
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            yarn commitlint --last --verbose
          else
            yarn commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

      - name: Format check
        run: yarn format:check

      - name: Validate release policy
        run: node --test scripts/validate-release.test.cjs

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Validate package artifacts
        run: yarn release:check-package

      - name: Validate example
        run: yarn example:typecheck && yarn example:config && yarn example:export

      - name: Validate changesets
        run: yarn changeset:status
