name: CI

on:
  push:
    branches: [main, '0.x']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install example dependencies
        run: yarn --cwd example install --immutable

      - name: Commitlint
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            yarn commitlint --last --verbose
          else
            yarn commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

      - name: Format check
        run: yarn format:check

      - name: Validate release policy
        run: node --test scripts/validate-release.test.cjs

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Validate example
        run: yarn example:typecheck && yarn example:config && yarn example:export

      - name: Prepare Changesets base branch
        shell: bash
        run: |
          base_branch="$(node -e "const config = require('./.changeset/config.json'); if (typeof config.baseBranch === 'string') process.stdout.write(config.baseBranch)")"
          if [ -z "$base_branch" ] || ! git check-ref-format --branch "$base_branch" >/dev/null; then
            echo "::error::.changeset/config.json must define a valid baseBranch"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/heads/$base_branch"; then
            echo "Local Changesets base branch '$base_branch' already exists; leaving it unchanged."
          else
            remote_ref="refs/remotes/origin/$base_branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "::error::Changesets base branch origin/$base_branch does not exist"
              exit 1
            fi

            git branch --no-track "$base_branch" "origin/$base_branch"
          fi

      - name: Validate changesets
        run: yarn changeset:status
