name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm
        run: npm install --global 'npm@^11.5.1'

      - name: Show runtime versions
        run: |
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install example dependencies
        run: yarn --cwd example install --immutable

      - name: Validate release tag and channel
        id: release
        run: node scripts/validate-release.cjs

      - name: Verify release branch ancestry
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          git fetch origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "Refusing to publish tag outside origin/$RELEASE_BRANCH."
            exit 1
          fi

      - name: Typecheck
        run: yarn typecheck

      - name: Build package
        run: yarn build

      - name: Validate package contents
        run: yarn release:check-package

      - name: Check registry version
        run: node scripts/check-registry-version.cjs "$(node -p "require('./package.json').version")"

      - name: Publish to npm
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"

      - name: Verify published package
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            PUBLISHED_VERSION="$(
              npm view "@ftsukic/tsuki@${VERSION}" version \
                --registry=https://registry.npmjs.org \
                --prefer-online \
                2>/dev/null || true
            )"
            CHANNEL_VERSION="$(
              npm view @ftsukic/tsuki "dist-tags.${NPM_TAG}" \
                --registry=https://registry.npmjs.org \
                --prefer-online \
                2>/dev/null || true
            )"

            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$CHANNEL_VERSION" = "$VERSION" ]; then
              echo "Verified @ftsukic/tsuki@${VERSION} with ${NPM_TAG} dist-tag."
              exit 0
            fi
            echo "npm publication is still processing (attempt ${attempt}/30, version=${PUBLISHED_VERSION:-<none>}, channel=${CHANNEL_VERSION:-<none>})."
            if [ "$attempt" -lt 30 ]; then sleep 20; fi
          done
          echo "Published package was not fully visible on npm after 10 minutes."
          echo "Expected version: ${VERSION}"
          echo "Observed version: ${PUBLISHED_VERSION:-<none>}"
          echo "Observed ${NPM_TAG}: ${CHANNEL_VERSION:-<none>}"
          exit 1
