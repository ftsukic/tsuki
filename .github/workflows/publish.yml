name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm
        run: npm install --global 'npm@^11.5.1'

      - name: Show runtime versions
        run: |
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install example dependencies
        run: yarn --cwd example install --immutable

      - name: Verify main ancestry
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish tag outside origin/main."
            exit 1
          fi

      - name: Validate release tag
        run: node scripts/validate-release.cjs

      - name: Typecheck
        run: yarn typecheck

      - name: Build package
        run: yarn build

      - name: Validate package contents
        run: yarn release:check-package

      - name: Check registry version
        run: node scripts/check-registry-version.cjs "$(node -p "require('./package.json').version")"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Verify published package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MAX_ATTEMPTS=30
          RETRY_DELAY_SECONDS=10
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            VERSION_ERROR_FILE="$(mktemp)"
            VERSION_STATUS=0
            PUBLISHED_VERSION="$(npm view "@ftsukic/tsuki@${VERSION}" version --registry=https://registry.npmjs.org --prefer-online 2>"$VERSION_ERROR_FILE")" || VERSION_STATUS=$?
            VERSION_ERROR="$(<"$VERSION_ERROR_FILE")"
            rm -f "$VERSION_ERROR_FILE"

            LATEST_ERROR_FILE="$(mktemp)"
            LATEST_STATUS=0
            LATEST_JSON="$(npm view @ftsukic/tsuki dist-tags --json --registry=https://registry.npmjs.org --prefer-online 2>"$LATEST_ERROR_FILE")" || LATEST_STATUS=$?
            LATEST_ERROR="$(<"$LATEST_ERROR_FILE")"
            rm -f "$LATEST_ERROR_FILE"
            LATEST="$(printf '%s' "$LATEST_JSON" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => { try { process.stdout.write(JSON.parse(input).latest || '') } catch {} })")"

            if [ "$VERSION_STATUS" -ne 0 ] && ! printf '%s\n' "$VERSION_ERROR" | grep -Eiq 'E404|404 Not Found|is not in this registry'; then
              echo "Registry version query failed (attempt ${attempt}/${MAX_ATTEMPTS}, version=${PUBLISHED_VERSION:-<none>}, latest=${LATEST:-<none>}): ${VERSION_ERROR:-exit status ${VERSION_STATUS}}"
              exit "$VERSION_STATUS"
            fi
            if [ "$LATEST_STATUS" -ne 0 ] && ! printf '%s\n' "$LATEST_ERROR" | grep -Eiq 'E404|404 Not Found|is not in this registry'; then
              echo "Registry dist-tags query failed (attempt ${attempt}/${MAX_ATTEMPTS}, version=${PUBLISHED_VERSION:-<none>}, latest=${LATEST:-<none>}): ${LATEST_ERROR:-exit status ${LATEST_STATUS}}"
              exit "$LATEST_STATUS"
            fi

            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$LATEST" = "$VERSION" ]; then
              echo "Verified @ftsukic/tsuki@${VERSION} with latest dist-tag."
              exit 0
            fi
            echo "Registry has not converged yet (attempt ${attempt}/${MAX_ATTEMPTS}, version=${PUBLISHED_VERSION:-<none>}, latest=${LATEST:-<none>})."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then sleep "$RETRY_DELAY_SECONDS"; fi
          done
          echo "Published package verification failed after ${MAX_ATTEMPTS} attempts (version=${PUBLISHED_VERSION:-<none>}, latest=${LATEST:-<none>})."
          exit 1
